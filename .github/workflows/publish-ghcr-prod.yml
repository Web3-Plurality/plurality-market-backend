name: Manual Release Docker Image Prod

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to promote (e.g., 1.31.0). Leave empty to use the latest git tag.'
        required: false
        type: string

permissions:
  contents: read
  packages: write        # push images to ghcr.io

jobs:
  semantic_release:
    runs-on: ubuntu-latest
    steps:
      - name: Free disk space
        run: |
          docker system prune -af
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android

      - name: Docker Login
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login ghcr.io --username ${{ github.actor }} --password-stdin

      - name: Checkout code
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262  # v4.4.0
        with:
          fetch-depth: 0   # tags needed for git describe

      - name: Determine Version to Promote
        id: determine_version
        run: |
          if [ -n "${{ github.event.inputs.version }}" ]; then
            VERSION="${{ github.event.inputs.version }}"
            echo "Using manually specified version: $VERSION"
          else
            VERSION=$(git describe --tags --abbrev=0)
            VERSION=${VERSION#v}
            echo "Using latest git tag: $VERSION"
          fi
          echo "VERSION=$VERSION" >> $GITHUB_ENV
          echo "PRE_IMAGE=ghcr.io/web3-plurality/plurality-market-backend-pre:$VERSION" >> $GITHUB_ENV

      - name: Verify Pre-release Image Exists
        run: |
          echo "Verifying that pre-release image exists: ${{ env.PRE_IMAGE }}"
          docker manifest inspect ${{ env.PRE_IMAGE }} > /dev/null 2>&1 || {
            echo "Error: Pre-release image ${{ env.PRE_IMAGE }} does not exist!"
            echo "Available tags can be viewed at: https://github.com/orgs/Web3-Plurality/packages?repo_name=plurality-market-backend"
            exit 1
          }
          echo "Pre-release image verified successfully"

      - name: Pull Pre-release Image
        run: |
          echo "Pulling pre-release image: ${{ env.PRE_IMAGE }}"
          docker pull ${{ env.PRE_IMAGE }}

      - name: Promote to Production Tags
        run: |
          echo "Promoting to production..."
          echo "Tagging as: ghcr.io/web3-plurality/plurality-market-backend:${{ env.VERSION }}"
          docker tag ${{ env.PRE_IMAGE }} ghcr.io/web3-plurality/plurality-market-backend:${{ env.VERSION }}

          echo "Tagging as: ghcr.io/web3-plurality/plurality-market-backend:latest"
          docker tag ${{ env.PRE_IMAGE }} ghcr.io/web3-plurality/plurality-market-backend:latest

          echo "Pushing production tags..."
          docker push ghcr.io/web3-plurality/plurality-market-backend:${{ env.VERSION }}
          docker push ghcr.io/web3-plurality/plurality-market-backend:latest

          echo "Successfully promoted pre-release ${{ env.PRE_IMAGE }} to production version ${{ env.VERSION }} and latest"
